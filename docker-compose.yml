x-go-image: &go-image
  build: ./backend
  image: rolodex:local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    command: ["postgres", "-c", "hba_file=/etc/rolodex/postgres/pg_hba.conf", "-c", "wal_keep_size=256MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/k8s/postgres:/etc/rolodex/postgres:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Read-only hot standby of the profiles primary; serves profile reads.
  postgres-replica:
    image: postgres:16-alpine
    user: "70:70"
    entrypoint: ["sh", "/etc/rolodex/postgres/replica-entrypoint.sh"]
    environment:
      PRIMARY_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REPLICATION_USER: ${REPLICATION_USER:?set in .env}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      HBA_FILE: /etc/rolodex/postgres/pg_hba.conf
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
      - ./deploy/k8s/postgres:/etc/rolodex/postgres:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Separate server for usernames and password hashes, with its own account.
  credentials-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${CREDENTIALS_DB_USER:?set in .env}
      POSTGRES_PASSWORD: ${CREDENTIALS_DB_PASSWORD}
      POSTGRES_DB: ${CREDENTIALS_DB_NAME:?set in .env}
    volumes:
      - credentials-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  mockvendors:
    <<: *go-image
    entrypoint: ["/usr/local/bin/mockvendors"]
    environment:
      MOCK_ABC_USERNAME: ${ABC_USERNAME:?set in .env}
      MOCK_ABC_PASSWORD: ${ABC_PASSWORD:?set in .env}
      MOCK_XYC_USERNAME: ${XYC_USERNAME:?set in .env}
      MOCK_XYC_PASSWORD: ${XYC_PASSWORD:?set in .env}
      XYC_FAILURE_RATE: ${XYC_FAILURE_RATE:-0.3}
    ports:
      - "9001:9001"
      - "9002:9002"

  seed:
    <<: *go-image
    entrypoint: ["/usr/local/bin/seed"]
    environment:
      DB_DRIVER: postgres
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      CREDENTIALS_DATABASE_URL: postgres://${CREDENTIALS_DB_USER}:${CREDENTIALS_DB_PASSWORD}@credentials-db:5432/${CREDENTIALS_DB_NAME}?sslmode=disable
      SEED_PASSWORD: ${SEED_PASSWORD:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      credentials-db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *go-image
    environment:
      HTTP_ADDR: ":8080"
      DB_DRIVER: postgres
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATABASE_READ_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-replica:5432/${POSTGRES_DB}?sslmode=disable
      CREDENTIALS_DATABASE_URL: postgres://${CREDENTIALS_DB_USER}:${CREDENTIALS_DB_PASSWORD}@credentials-db:5432/${CREDENTIALS_DB_NAME}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      ABC_BASE_URL: http://mockvendors:9001
      ABC_USERNAME: ${ABC_USERNAME}
      ABC_PASSWORD: ${ABC_PASSWORD}
      XYC_BASE_URL: http://mockvendors:9002
      XYC_USERNAME: ${XYC_USERNAME}
      XYC_PASSWORD: ${XYC_PASSWORD}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_ALLOWED_EMAILS: ${FIREBASE_ALLOWED_EMAILS:-}
      FIREBASE_ALLOWED_DOMAINS: ${FIREBASE_ALLOWED_DOMAINS:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      credentials-db:
        condition: service_healthy
      postgres-replica:
        condition: service_started
      seed:
        condition: service_completed_successfully
      mockvendors:
        condition: service_started

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    ports:
      - "3000:8080"
    depends_on:
      - api

volumes:
  pgdata:
  pgdata-replica:
  credentials-data:
