server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Each location includes the security headers itself, so the per-location
    # Cache-Control below does not drop them (Semgrep cannot follow includes).
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable"; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store"; # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        try_files $uri /index.html;
    }
}
