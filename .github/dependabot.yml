version: 2
# cooldown delays adopting freshly published releases, a common window for
# compromised packages to be discovered and yanked.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories: [/web, /e2e]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    # typescript-eslint pins a TypeScript peer range (currently <6.1); bumping
    # TypeScript beyond it fails the whole grouped update. Move both together
    # by hand once typescript-eslint supports the newer release.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/, /web]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
