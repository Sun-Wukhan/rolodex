name: Pages demo

# Production deploy of the static demo. Called by the Delivery pipeline only
# after staging passed its tests and DAST; workflow_dispatch allows a manual
# redeploy (for example, a rollback from an older commit).
on:
  workflow_call:
    outputs:
      page_url:
        description: URL of the deployed site
        value: ${{ jobs.deploy.outputs.page_url }}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build with the in-browser demo API
        env:
          VITE_DEMO_MODE: "true"
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # GitHub Pages has no SPA rewrites; serving index.html as 404.html lets
      # deep links such as /users/<id> boot the client-side router.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5