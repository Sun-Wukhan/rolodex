name: Security (SAST)

# Static analysis that needs no running deployment. Runs on every PR, weekly
# (new CVEs and rules land without code changes), and as the first stage of
# the delivery pipeline via workflow_call. Findings are uploaded as SARIF to
# the repository's Security > Code scanning tab.
on:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SEMGREP_IMAGE: semgrep/semgrep:1.140.0
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1
  TRIVY_IMAGE: aquasec/trivy:0.75.0

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep scan \
            --metrics=off --quiet \
            --config p/default --config p/golang --config p/typescript --config p/react \
            --config p/secrets --config p/dockerfile --config p/kubernetes --config p/github-actions \
            --exclude node_modules --exclude dist \
            --sarif-output=semgrep.sarif --json-output=semgrep.json
      - name: Gate on ERROR-severity findings
        run: |
          jq -r '.results[] | "\(.extra.severity)\t\(.path):\(.start.line)\t\(.check_id)"' semgrep.json | sort
          errors="$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' semgrep.json)"
          total="$(jq '.results | length' semgrep.json)"
          {
            echo "### Semgrep"
            echo
            echo "${total} finding(s), ${errors} at ERROR severity (blocking)."
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$errors" -eq 0 ]]
      - if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Scan full git history
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" git \
            --redact --no-banner --report-format sarif --report-path gitleaks.sarif .
      - if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  trivy:
    name: Trivy (dependencies, IaC, secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivy-cache
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - name: Report all findings (SARIF)
        run: |
          docker run --rm -v "$PWD:/src" -v "$PWD/.trivy-cache:/root/.cache" -w /src "$TRIVY_IMAGE" \
            fs --quiet --timeout 15m --scanners vuln,misconfig,secret \
            --skip-dirs .trivy-cache --format sarif --output trivy.sarif .
      - name: Fail on HIGH/CRITICAL
        run: |
          docker run --rm -v "$PWD:/src" -v "$PWD/.trivy-cache:/root/.cache" -w /src "$TRIVY_IMAGE" \
            fs --quiet --timeout 15m --scanners vuln,misconfig,secret --skip-dirs .trivy-cache \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
      - if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
