# Usernames and password hashes live on their own PostgreSQL server with its
# own account (CREDENTIALS_DB_*), separate from the profiles database.
apiVersion: v1
kind: Service
metadata:
  name: credentials-db
  labels: { app.kubernetes.io/name: credentials-db }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: credentials-db }
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: credentials-db
  labels: { app.kubernetes.io/name: credentials-db }
spec:
  serviceName: credentials-db
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: credentials-db }
  template:
    metadata:
      labels: { app.kubernetes.io/name: credentials-db }
    spec:
      automountServiceAccountToken: false
      # postgres:alpine's "postgres" user is UID/GID 70; fsGroup makes the volume writable.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: rolodex-env, key: CREDENTIALS_DB_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: rolodex-env, key: CREDENTIALS_DB_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: rolodex-env, key: CREDENTIALS_DB_NAME } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          # Besides PGDATA, postgres writes its socket/lock files and temp files.
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
