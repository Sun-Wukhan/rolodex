apiVersion: v1
kind: Service
metadata:
  name: mockvendors
  labels: { app.kubernetes.io/name: mockvendors }
spec:
  selector: { app.kubernetes.io/name: mockvendors }
  ports:
    - name: abc
      port: 9001
    - name: xyc
      port: 9002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mockvendors
  labels: { app.kubernetes.io/name: mockvendors }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mockvendors }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mockvendors }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mockvendors
          image: rolodex:local
          imagePullPolicy: Never
          command: ["/usr/local/bin/mockvendors"]
          ports:
            - containerPort: 9001
            - containerPort: 9002
          env:
            - name: MOCK_ABC_USERNAME
              valueFrom: { secretKeyRef: { name: rolodex-env, key: ABC_USERNAME } }
            - name: MOCK_ABC_PASSWORD
              valueFrom: { secretKeyRef: { name: rolodex-env, key: ABC_PASSWORD } }
            - name: MOCK_XYC_USERNAME
              valueFrom: { secretKeyRef: { name: rolodex-env, key: XYC_USERNAME } }
            - name: MOCK_XYC_PASSWORD
              valueFrom: { secretKeyRef: { name: rolodex-env, key: XYC_PASSWORD } }
            - name: XYC_FAILURE_RATE
              valueFrom: { secretKeyRef: { name: rolodex-env, key: XYC_FAILURE_RATE, optional: true } }
          readinessProbe:
            httpGet: { path: /healthz, port: 9001 }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
