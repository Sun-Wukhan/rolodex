# Client authentication for the profiles primary and its replica. Passed with
# `-c hba_file=...` so it also applies to data directories initialised before
# replication was added. The stock image only allows replication from
# localhost; the replica needs it over the network.
# TYPE  DATABASE     USER  ADDRESS  METHOD
local   all          all            trust
host    all          all   all      scram-sha-256
host    replication  all   all      scram-sha-256
