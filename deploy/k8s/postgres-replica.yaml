# Read-only streaming replica (hot standby) of the profiles primary. The API
# sends profile reads here and writes to the primary; see
# internal/repository/replica.
apiVersion: v1
kind: Service
metadata:
  name: postgres-replica
  labels: { app.kubernetes.io/name: postgres-replica }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: postgres-replica }
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-replica
  labels: { app.kubernetes.io/name: postgres-replica }
spec:
  serviceName: postgres-replica
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres-replica }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres-replica }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:16-alpine
          command: ["sh", "/etc/rolodex/postgres/replica-entrypoint.sh"]
          ports:
            - containerPort: 5432
          env:
            - name: PRIMARY_HOST
              value: postgres
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: rolodex-env, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: rolodex-env, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: rolodex-env, key: POSTGRES_DB } }
            - name: REPLICATION_USER
              valueFrom: { secretKeyRef: { name: rolodex-env, key: REPLICATION_USER } }
            - name: REPLICATION_PASSWORD
              valueFrom: { secretKeyRef: { name: rolodex-env, key: REPLICATION_PASSWORD } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: HBA_FILE
              value: /etc/rolodex/postgres/pg_hba.conf
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: config
              mountPath: /etc/rolodex/postgres
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap: { name: postgres-replication }
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
