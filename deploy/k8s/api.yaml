apiVersion: v1
kind: Service
metadata:
  name: api
  labels: { app.kubernetes.io/name: api }
spec:
  selector: { app.kubernetes.io/name: api }
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app.kubernetes.io/name: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: api }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: rolodex:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: rolodex-env, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: rolodex-env, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: rolodex-env, key: POSTGRES_DB } }
            - name: HTTP_ADDR
              value: ":8080"
            - name: DB_DRIVER
              value: postgres
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable
            - name: CREDENTIALS_DB_USER
              valueFrom: { secretKeyRef: { name: rolodex-env, key: CREDENTIALS_DB_USER } }
            - name: CREDENTIALS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: rolodex-env, key: CREDENTIALS_DB_PASSWORD } }
            - name: CREDENTIALS_DB_NAME
              valueFrom: { secretKeyRef: { name: rolodex-env, key: CREDENTIALS_DB_NAME } }
            - name: CREDENTIALS_DATABASE_URL
              value: postgres://$(CREDENTIALS_DB_USER):$(CREDENTIALS_DB_PASSWORD)@credentials-db:5432/$(CREDENTIALS_DB_NAME)?sslmode=disable
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: rolodex-env, key: JWT_SECRET } }
            - name: CORS_ALLOWED_ORIGINS
              value: http://localhost:3000,http://localhost:5173
            - name: ABC_BASE_URL
              value: http://mockvendors:9001
            - name: ABC_USERNAME
              valueFrom: { secretKeyRef: { name: rolodex-env, key: ABC_USERNAME } }
            - name: ABC_PASSWORD
              valueFrom: { secretKeyRef: { name: rolodex-env, key: ABC_PASSWORD } }
            - name: XYC_BASE_URL
              value: http://mockvendors:9002
            - name: XYC_USERNAME
              valueFrom: { secretKeyRef: { name: rolodex-env, key: XYC_USERNAME } }
            - name: XYC_PASSWORD
              valueFrom: { secretKeyRef: { name: rolodex-env, key: XYC_PASSWORD } }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
