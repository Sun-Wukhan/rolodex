# Included from every location block: nginx drops server-level add_header
# directives as soon as a location declares its own.
#
# Google sign-in (Firebase signInWithPopup) shapes three of these: the popup
# must keep its opener (COOP same-origin-allow-popups), Firebase embeds its
# auth helper iframe from <project>.firebaseapp.com and loads apis.google.com
# (so no COEP require-corp, which would block both), and the SDK calls the
# Identity Toolkit and Secure Token APIs (connect-src).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com; connect-src 'self' http://localhost:8080 https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src https://*.firebaseapp.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
